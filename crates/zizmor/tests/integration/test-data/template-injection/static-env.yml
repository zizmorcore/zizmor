name: static-env
on: pull_request
permissions: {}

env:
  WORKFLOW_LITERAL: fixed
  WORKFLOW_TITLE: ${{ github.event.pull_request.title }}
  JOB_LITERAL: ${{ github.event.pull_request.title }}
  JOB_TITLE: fixed

jobs:
  scopes:
    name: Environment scopes
    runs-on: ubuntu-latest
    env:
      JOB_LITERAL: fixed
      JOB_TITLE: ${{ github.event.pull_request.title }}
      STEP_LITERAL: ${{ github.event.pull_request.title }}
      STEP_TITLE: fixed

    steps:
      - name: Read the most specific definition of each variable
        env:
          STEP_LITERAL: fixed
          STEP_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "${{ env.STEP_LITERAL }}"
          echo "${{ env.JOB_LITERAL }}"
          echo "${{ env.WORKFLOW_LITERAL }}"

          echo "${{ env.STEP_TITLE }}"
          echo "${{ env.JOB_TITLE }}"
          echo "${{ env.WORKFLOW_TITLE }}"

          echo "WORKFLOW_LITERAL=$GITHUB_HEAD_REF" >> "$GITHUB_ENV"

      - name: Read a workflow variable after an earlier step overwrote it
        run: echo "${{ env.WORKFLOW_LITERAL }}"
