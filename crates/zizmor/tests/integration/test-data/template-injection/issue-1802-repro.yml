---
name: issue-1802-repro
"on":
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo testing

  repro: # zizmor: ignore[secrets-outside-env]
    name: Repro
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test-matrix.result }}" = "success"
          test "${{ needs['test-matrix']['result'] }}" = "success"
          test "${{ needs.TEST-MATRIX['result'] }}" = "success"
