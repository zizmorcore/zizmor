name: input-caps
on:
  workflow_call:
    inputs:
      test:
        type: string
      called:
        type: boolean
  workflow_dispatch:
    inputs:
      test:
        type: boolean
      manual:
        type: boolean
  push:

permissions: {}

jobs:
  inject-me:
    runs-on: ubuntu-latest

    steps:
      - name: Only workflow_call accepts the string 'true'
        run: echo "${{ inputs.test == 'true' && github.ref_name || '' }}"

      - name: Only push has neither boolean input
        run: echo "${{ format('{0}{1}', inputs.called, inputs.manual) == '' && github.ref_name || '' }}"

      - name: These inputs belong to different triggers
        run: echo "${{ inputs.called && inputs.manual && github.ref_name || '' }}"

      - name: Both reads see the same boolean
        run: echo "${{ inputs.manual && !inputs['MANUAL'] && github.ref_name || '' }}"

      - name: A scalar input has no child properties
        run: echo "${{ inputs.test.nested }}"

      - name: Computed keys can select a declared string input through env
        env:
          VALUE: ${{ inputs[vars.INPUT_NAME] }}
        run: echo "${{ env[vars.ENV_NAME] }}"
