# reproduction case for https://github.com/zizmorcore/zizmor/pull/317

name: PR-317-REPRO
on:
  pull_request:

permissions: {}

jobs:
  PR-317-REPRO:
    name: PR-317-REPRO
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - bar: abc
            owner: abc

          # Both values contain an expression, but only the title is arbitrary.
          - bar: prefix-${{ github.event.pull_request.title }}
            owner: prefix-${{ github.repository_owner }}

    steps:
      - run: |
          echo ${{ matrix.bar }}
          echo ${{ matrix.owner }}
