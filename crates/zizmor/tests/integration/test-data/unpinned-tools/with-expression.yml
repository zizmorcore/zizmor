name: unpinned-tools-with-expression

on: push

permissions: {}

jobs:
  unpinned-tools:
    name: unpinned-tools
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with: ${{ inputs.trivy-options }}
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: 0.69.3
