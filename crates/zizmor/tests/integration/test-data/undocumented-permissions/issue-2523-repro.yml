# Repro case for #2523.
# See: <https://github.com/zizmorcore/zizmor/issues/2523>

name: CI

on: push

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.base_ref == main }}

jobs:
  repro:
    name: repro
    needs:
      - rust-test
    permissions:
      contents: none
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: repro
        run: |
          echo foo
