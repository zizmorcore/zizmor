# https://github.com/zizmorcore/zizmor/issues/2411

default_language_version:
  python:
    preference: only-system

repos:
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.110.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        files:
          glob:
            - .github/renovate.json5
