name: Release zizmor to crates.io 📦

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        description: "The tag to release (e.g., v1.0.0)"
        required: true

permissions: {}

jobs:
  crates:
    name: Publish zizmor crates to crates.io 📦
    runs-on: ubuntu-latest

    environment:
      name: crates.io
      url: https://crates.io/crates/zizmor

    permissions:
      id-token: write # for trusted publishing to crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
