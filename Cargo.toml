[workspace]
resolver = "2"
members = [
  "crates/github-actions-expressions",
  "crates/github-actions-models",
  "crates/pre-commit-models",
  "crates/subfeature",
  "crates/tree-sitter-iter",
  "crates/yamlpatch",
  "crates/yamlpath",
  "crates/zizmor",
  "crates/zizmor-sarif",
]

[workspace.package]
version = "1.30.0-rc2"
edition = "2024"
rust-version = "1.97.0"
readme = "README.md"
homepage = "https://docs.zizmor.sh"
license = "MIT"

[workspace.dependencies]
github-actions-expressions = { path = "crates/github-actions-expressions", version = "1.30.0-rc2" }
github-actions-models = { path = "crates/github-actions-models", version = "1.30.0-rc2" }
pre-commit-models = { path = "crates/pre-commit-models", version = "1.30.0-rc2" }
subfeature = { path = "crates/subfeature", version = "1.30.0-rc2" }
tree-sitter-iter = { path = "crates/tree-sitter-iter", version = "1.30.0-rc2" }
yamlpatch = { path = "crates/yamlpatch", version = "1.30.0-rc2" }
yamlpath = { path = "crates/yamlpath", version = "1.30.0-rc2" }
zizmor-sarif = { path = "crates/zizmor-sarif", version = "1.30.0-rc2" }

annotate-snippets = "0.12.16"
anstream = "1.0.0"
anyhow = "1.0.102"
assert_cmd = "2.2.2"
async-trait = "0.1.89"
camino = "1.2.2"
clap = "4.6.1"
clap_complete = "4.6.5"
clap_complete_nushell = "4.6.0"
clap-verbosity-flag = { version = "3.0.4", default-features = false }
csv = "1.3.1"
etcetera = "0.11.0"
flate2 = "1.1.9"
fst = "0.4.7"
futures = "0.3"
http = "1.4.1"
http-cache-reqwest = { version = "1.0.0-alpha.7", default-features = false, features = ["manager-cacache", "manager-moka", "url-standard"] }
human-panic = "2.0.8"
ignore = "0.4.25"
indexmap = { version = "2.13.1", features = ["serde"] }
indicatif = "0.18"
insta = "1.48.0"
itertools = "0.15.0"
jsonschema = { version = "0.49.1", default-features = false }
line-index = "0.1.2"
memchr = "2.8.0"
owo-colors = "4.3.0"
regex = "1.12.3"
reqwest = "0.13"
reqwest-middleware = "0.5.2"
schemars = "1.2"
self_cell = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# NOTE: 3 is available, but insta uses ^2.1
similar = "3.1"
tar = "0.4.46"
tempfile = "3"
terminal-link = "0.1.0"
thiserror = "2.0.18"
tikv-jemallocator = "0.7"
tokio = { version = "1.52.2", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp-server = "0.23"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23" }
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25.1"
# Exact version since the upstream performed a breaking change outside of semver.
# See: https://github.com/zizmorcore/zizmor/pull/1427
tree-sitter-powershell = "=0.26.4"
tree-sitter-yaml = "0.7.2"
typomania = { version = "0.2.0", default-features = false }
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
yaml_serde = "0.10"

[workspace.lints.clippy]
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
if_not_else = "allow"
needless_lifetimes = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
todo = "warn"
unimplemented = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_debug = "warn"
use_self = "warn"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[profile.dev.package]
insta.opt-level = 3

[profile.release]
lto = true
